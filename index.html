<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: soft lavender ground, a rounded violet rail on the left (bottom bar + centre add button on phones),
   a violet hero with live counts, then "coming up" cards and working lists. */
:root{
  --bg:#F2F0F9; --surface:#FFFFFF; --surface-2:#F7F5FD; --line:#E6E2F3;
  --ink:#1C1A2E; --ink-2:#5D5A75; --ink-3:#8E8AA8;
  --violet:#6B4EF0; --violet-deep:#4A2FC4; --violet-soft:#ECE7FF; --on-violet:#FFFFFF;
  --pink:#E2507F; --pink-soft:#FDE6EE; --green:#14936A; --green-soft:#DDF4EA;
  --amber:#C27A0E; --amber-soft:#FCEFD8; --blue:#2F6FD6; --blue-soft:#E2ECFC;
  --shadow:0 1px 2px rgba(40,30,90,.05),0 8px 24px rgba(60,40,140,.07);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:10px; --paper:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13111D; --surface:#1D1A2B; --surface-2:#252137; --line:#312C47;
  --ink:#EEEBFA; --ink-2:#ABA6C6; --ink-3:#7E7999;
  --violet:#8B72FF; --violet-deep:#5B3FD9; --violet-soft:#2C2550; --on-violet:#FFFFFF;
  --pink:#FF7EA6; --pink-soft:#3D1F2C; --green:#4FD1A0; --green-soft:#17352B;
  --amber:#F2B04B; --amber-soft:#3A2D16; --blue:#7FAEFF; --blue-soft:#1C2A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111D; --surface:#1D1A2B; --surface-2:#252137; --line:#312C47;
  --ink:#EEEBFA; --ink-2:#ABA6C6; --ink-3:#7E7999;
  --violet:#8B72FF; --violet-deep:#5B3FD9; --violet-soft:#2C2550; --on-violet:#FFFFFF;
  --pink:#FF7EA6; --pink-soft:#3D1F2C; --green:#4FD1A0; --green-soft:#17352B;
  --amber:#F2B04B; --amber-soft:#3A2D16; --blue:#7FAEFF; --blue-soft:#1C2A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;padding:16px;min-height:100%}
.rail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 32px);background:linear-gradient(170deg,var(--violet),var(--violet-deep));color:var(--on-violet);border-radius:26px;padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.brand span{font-size:12px;opacity:.75}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:inherit;padding:11px 12px;border-radius:14px;text-align:left;opacity:.82;font-weight:600}
.nav-btn:hover{background:rgba(255,255,255,.1);opacity:1}
.nav-btn[aria-current="page"]{background:rgba(255,255,255,.2);opacity:1}
.nav-btn .count{margin-left:auto;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.rail-foot{margin-top:auto;font-size:12px;opacity:.8;padding:10px;border-top:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:10px}
.rail-foot img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 8px rgba(30,0,90,.3)}

main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:24px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.top .sub{color:var(--ink-3);font-size:13px}
.top-left{flex:1 1 220px;min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-width:0;flex:0 1 280px;color:var(--ink-3)}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.btn.primary:hover{background:var(--violet-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--pink);border-color:var(--pink-soft)}
.btn.small{padding:6px 12px;font-size:13px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{color:var(--violet);border-color:var(--violet)}
.icon-btn.done{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px;color:var(--on-violet);background:radial-gradient(120% 140% at 100% 0%,rgba(255,170,210,.35),transparent 55%),linear-gradient(135deg,var(--violet),var(--violet-deep))}
.hero h2{font-family:var(--f-display);font-size:30px;margin:0 0 4px;line-height:1.1}
.hero p{margin:0;opacity:.8}
.hero-stats{margin-top:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hstat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:14px 16px;min-width:0}
.hstat .lbl{font-size:12px;opacity:.85;letter-spacing:.02em}
.hstat .val{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.2;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstat .note{font-size:12px;opacity:.75}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h3{font-family:var(--f-display);font-size:19px;margin:0}
.section-head .link{border:0;background:none;color:var(--violet);font-weight:600;font-size:13px}

/* upcoming cards */
.upcoming{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.ucard{scroll-snap-align:start;background:var(--surface);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:168px;box-shadow:var(--shadow);border:0;text-align:left;color:var(--ink)}
.ucard:first-child{background:var(--violet);color:var(--on-violet)}
.ucard:first-child .kind,.ucard:first-child .meta{color:inherit;opacity:.85}
.ucard:first-child .kind-ico{background:rgba(255,255,255,.95);color:var(--violet)}
.ucard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kind-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet)}
.ucard .title{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ucard .amount{font-family:var(--f-display);font-weight:700;font-size:18px}
.ucard .meta{font-size:12px;color:var(--ink-3);margin-top:auto}
.kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);min-width:0}

/* due list */
.group-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:14px 0 6px}
.group-label.overdue{color:var(--pink)}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.group-label + .item{border-top:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.item .actions{display:flex;gap:6px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--violet)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.pill.pink{background:var(--pink-soft);color:var(--pink)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}

.activity .a{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.activity .a:first-of-type{border-top:0}
.activity img{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover}
.note-from{display:flex;align-items:center;gap:8px}
.note-from img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.8)}
.note-from img.big{width:44px;height:44px}
.activity .s{font-size:12px;color:var(--ink-3)}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gadd{display:flex;gap:8px;flex-wrap:wrap}
.gadd input,.gadd select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;min-width:0}
.gadd #gItem{flex:1 1 220px}.gadd #gQty{flex:0 1 110px}.gadd #gAisle{flex:0 1 160px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--violet);background:transparent;display:grid;place-items:center;color:var(--on-violet);flex:none;padding:0}
.check svg{width:16px;height:16px;stroke-width:3;opacity:0}
.check[aria-checked="true"]{background:var(--violet)}
.check[aria-checked="true"] svg{opacity:1}
.item.got .t{text-decoration:line-through;color:var(--ink-3)}
.datebox{width:54px;height:58px;border-radius:14px;background:var(--violet-soft);color:var(--violet);display:grid;align-content:center;justify-items:center;gap:2px;flex:none;line-height:1}
.datebox b{font-family:var(--f-display);font-size:22px}
.datebox span{font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.06em}
.ccard.past{opacity:.7}
.note-card,.modal.greet{background:radial-gradient(120% 140% at 0% 0%,rgba(255,255,255,.18),transparent 55%),linear-gradient(135deg,var(--pink),var(--violet-deep));color:#fff;border-radius:26px;padding:22px 24px}
.modal.greet{width:min(480px,100%);padding:28px}
#view > .note-card, #view > .who-card{margin-bottom:20px}
#view > .hero + section{margin-top:20px}
.note-eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.9}
.note-text{font-family:var(--f-display);font-size:24px;line-height:1.3;margin:10px 0 16px;white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:pretty}
.modal.greet .note-text{font-size:28px}
.note-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff}
.note-btn:hover{border-color:#fff}
.note-btn.on{background:#fff;color:var(--pink);border-color:#fff}
.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:58px;background:radial-gradient(90% 80% at 100% 100%,#3b0d86 0%,transparent 60%),linear-gradient(160deg,#150f28 0%,#1b0f38 50%,#250c55 100%);transition:opacity .45s ease,visibility .45s}
.loader.out{opacity:0;visibility:hidden}
.eq{position:relative;width:112px;height:118px}
.eq i{position:absolute;bottom:auto;width:8px;border-radius:8px;background:linear-gradient(180deg,#f45cf2,#d43fe6);box-shadow:0 0 14px rgba(232,80,240,.45);height:var(--h);top:calc(var(--y) - 203px);transform-origin:center;animation:eqpulse 1.1s ease-in-out infinite}
.eq i:nth-child(1){left:0;animation-delay:0s}.eq i:nth-child(2){left:19px;animation-delay:.12s}.eq i:nth-child(3){left:38px;animation-delay:.24s}
.eq i:nth-child(4){left:57px;animation-delay:.36s}.eq i:nth-child(5){left:76px;animation-delay:.48s}.eq i:nth-child(6){left:95px;animation-delay:.6s}
@keyframes eqpulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.loader-text{font-family:var(--f-body);font-weight:700;font-size:20px;letter-spacing:.32em;padding-left:.32em;color:#a79ad3}
@media (prefers-reduced-motion:reduce){.eq i{animation:none}}
.stack{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.due-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.due-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.due-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.due-tile{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;border-top:3px solid var(--violet)}
.due-tile.over{border-top-color:var(--pink)}.due-tile.today{border-top-color:var(--amber)}
.due-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap}
.due-title{font-weight:700;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.due-meta{font-size:12px;color:var(--ink-3)}
.due-amt{font-family:var(--f-display);font-weight:700;font-size:16px}
.due-actions{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.due-more{margin-top:12px;border:0;background:none;color:var(--violet);font-weight:600;font-size:13px;padding:0}
.lock-tag{margin-left:auto;font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:999px}
.rtt-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rtt-month{display:flex;align-items:center;gap:8px}.rtt-month h3{margin:0;font-family:var(--f-display);font-size:20px;min-width:150px;text-align:center}
.rtt-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px;align-items:start}
@media (max-width:900px){.rtt-cols{grid-template-columns:minmax(0,1fr)}}
.rtt-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;padding:12px;background:var(--surface-2);border-radius:16px}
.rtt-form input,.rtt-form select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0;flex:1 1 130px}
.rtt-form .wide{flex:1 1 100%}
.rtt-form .btn{flex:1 1 100%;justify-content:center}
.rtt-date{width:42px;flex:none;text-align:center;line-height:1.05;color:var(--violet)}.rtt-date b{display:block;font-family:var(--f-display);font-size:18px}.rtt-date span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.rtt-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface-2)}
.rtt-bar span{min-width:4px}
.rtt-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px}
.rtt-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rtt-legend em{font-style:normal;color:var(--ink-3);font-size:12px}
.bell{position:relative}
.bell-count{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.news{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--violet-soft);color:var(--violet);border-radius:14px;padding:10px 14px;font-weight:600;font-size:13px}
.news span{flex:1 1 200px}
.gen-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:20px;margin-top:14px;align-items:start}
.gen-preview{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));min-width:0}
.sheet{background:var(--paper);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
#genCanvas{display:block;width:100%;height:auto;aspect-ratio:540/779.76}
.gline{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:start;margin-bottom:8px}
.gline textarea,.gline input{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 12px;width:100%;min-width:0;resize:vertical;font-variant-numeric:tabular-nums}
.gline .icon-btn{font-size:18px;line-height:1}
.gen-form .group-label{margin-top:18px}
@media (max-width:1000px){.gen-grid{grid-template-columns:minmax(0,1fr)}.gen-preview{position:static}}
@media (max-width:500px){.gline{grid-template-columns:minmax(0,1fr) 92px 34px}}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-grid button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:14px;font-weight:600;color:var(--ink)}
.more-grid button[aria-current="page"]{border-color:var(--violet);color:var(--violet)}
.qa{border:0;border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;font-weight:700;color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.qa .kind-ico{width:40px;height:40px}
.qa:hover{transform:translateY(-1px)}
.qa small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.qa.t1 .kind-ico{background:var(--violet-soft);color:var(--violet)}
.qa.t2 .kind-ico{background:var(--blue-soft);color:var(--blue)}
.qa.t3 .kind-ico{background:var(--green-soft);color:var(--green)}
.qa.t4 .kind-ico{background:var(--pink-soft);color:var(--pink)}
.qa.t5 .kind-ico{background:var(--amber-soft);color:var(--amber)}

/* list views */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.spacer{flex:1}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tot{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.tot .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.tot .val{font-family:var(--f-display);font-size:22px;font-weight:700;margin-top:4px}
.tot.alert .val{color:var(--pink)}
.tot.good .val{color:var(--green)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.ccard .head{display:flex;gap:12px;align-items:center}
.mono{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--violet-soft);color:var(--violet);flex:none}
.ccard h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.ccard .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--ink-3)}
.ccard .facts b{display:block;color:var(--ink);font-size:14px}
.ccard .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

.empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:28px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,15,40,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:24px;width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(20,10,60,.3)}
.modal h3{font-family:var(--f-display);font-size:21px;margin:0 0 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:11px;color:var(--ink-3)}
.modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:10px 14px;font-weight:600;font-size:13px}

.bottom-nav{display:none}
@media (max-width:1100px){.hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding:16px 16px 96px}
  .rail{display:none}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{flex:1 1 100%}
  .bottom-nav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:24px;box-shadow:0 10px 30px rgba(40,20,100,.18);padding:8px;justify-content:space-around;align-items:center;z-index:40}
  .bottom-nav button{border:0;background:none;color:var(--ink-3);display:grid;place-items:center;gap:2px;font-size:10px;font-weight:600;padding:6px}
  .bottom-nav button[aria-current="page"]{color:var(--violet)}
  .fab{width:52px;height:52px;border-radius:50%!important;background:var(--violet)!important;color:#fff!important;margin-top:-30px;box-shadow:0 8px 20px rgba(107,78,240,.45)}
  .form{grid-template-columns:1fr}
  .hero{padding:20px}.hero h2{font-size:24px}
}

.loader-logo{width:300px;max-width:78vw;aspect-ratio:640/207;position:relative;filter:drop-shadow(0 0 1px rgba(255,255,255,.75)) drop-shadow(0 0 14px rgba(200,170,255,.55));animation:popIn 1s var(--ease-out) both}
.loader{gap:40px}
.loader::before{content:"";position:absolute;width:520px;height:260px;max-width:100vw;left:50%;top:50%;transform:translate(-50%,-95%);background:radial-gradient(closest-side,rgba(190,150,255,.38),rgba(150,90,255,.12) 55%,transparent);pointer-events:none}

/* ===== Glass sidebar ===== */
body{background:radial-gradient(40vmax 40vmax at 0% 0%,rgba(139,92,246,.28),transparent 60%),radial-gradient(35vmax 35vmax at 0% 100%,rgba(226,80,170,.20),transparent 60%),radial-gradient(45vmax 45vmax at 100% 10%,rgba(107,78,240,.14),transparent 60%),var(--bg);background-attachment:fixed}
.rail{background:linear-gradient(165deg,rgba(139,104,255,.82) 0%,rgba(107,78,240,.74) 45%,rgba(74,40,196,.80) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 50px rgba(74,40,196,.28),0 2px 6px rgba(40,20,100,.12);overflow:hidden;isolation:isolate}
.rail::before{content:"";position:absolute;inset:0 0 auto 0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0));pointer-events:none;z-index:-1}
.rail::after{content:"";position:absolute;width:220px;height:220px;right:-90px;bottom:60px;border-radius:50%;background:radial-gradient(circle,rgba(255,130,210,.45),transparent 70%);filter:blur(10px);pointer-events:none;z-index:-1}
.brand{flex-direction:column;align-items:flex-start;gap:6px;padding:4px 8px 20px}
.brand-logo{width:100%;max-width:196px;aspect-ratio:640/207;filter:drop-shadow(0 2px 10px rgba(30,0,80,.35)) drop-shadow(0 0 1px rgba(255,255,255,.5))}
.brand > span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;padding-left:2px}
.nav-btn:hover{background:rgba(255,255,255,.14)}
.nav-btn[aria-current="page"]{background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(40,10,120,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rail-foot{border-top-color:rgba(255,255,255,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rail{background:linear-gradient(165deg,rgba(110,80,230,.62),rgba(60,30,160,.62))}}
:root[data-theme="dark"] .rail{background:linear-gradient(165deg,rgba(110,80,230,.62),rgba(60,30,160,.62))}
/* ===== Motion: blur-rise reveals, light arc, cursor light, glass header ===== */
:root{--ease-out:cubic-bezier(.16,.84,.24,1)}
@keyframes riseIn{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes titleIn{from{opacity:0;transform:translateY(10px);filter:blur(8px);letter-spacing:.04em}to{opacity:1;transform:none;filter:none}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes arcRise{from{opacity:0;transform:translateY(45%) scaleX(.82)}to{opacity:1;transform:none}}
@keyframes arcBreathe{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes sheen{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(260%) skewX(-18deg)}}
#view.enter > *{animation:riseIn .8s var(--ease-out) both;animation-delay:calc(var(--i,0) * 90ms)}
#view.enter .due-tile,#view.enter .ucard,#view.enter .tot,#view.enter .qa,#view.enter .ccard,#view.enter .hstat{animation:riseIn .75s var(--ease-out) both;animation-delay:calc(var(--i,0) * 90ms + var(--j,0) * 60ms + 120ms)}
.top h1.enter-title{animation:titleIn .7s var(--ease-out) both}
/* light arc along the hero horizon */
.hero > *{position:relative;z-index:1}
.hero::before{content:"";position:absolute;left:-14%;right:-14%;top:calc(100% - 16px);height:320px;border-radius:50%;border-top:2px solid rgba(255,255,255,.9);
  box-shadow:0 -6px 18px rgba(255,255,255,.55),0 -24px 70px rgba(255,150,225,.55),inset 0 26px 70px rgba(255,170,235,.35);pointer-events:none;z-index:0;animation:arcBreathe 6s ease-in-out infinite}
#view.enter .hero::before{animation:arcRise 1.6s var(--ease-out) .15s both,arcBreathe 6s ease-in-out 1.8s infinite}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);pointer-events:none;z-index:0;transform:translateX(-120%) skewX(-18deg)}
#view.enter .hero::after{animation:sheen 1.8s var(--ease-out) .5s both}
/* cursor light on cards */
.glow{position:relative;isolation:isolate}
.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(139,114,255,.16),transparent 65%)}
.glow:hover::after{opacity:1}
.due-tile,.ucard,.tot,.qa,.ccard{transition:translate .35s var(--ease-out),box-shadow .35s var(--ease-out)}
.due-tile:hover,.ucard:hover,.tot:hover,.qa:hover,.ccard:hover{translate:0 -3px;box-shadow:0 2px 4px rgba(40,30,90,.05),0 18px 40px rgba(107,78,240,.16)}
.nav-btn{transition:background .3s var(--ease-out),opacity .3s,translate .3s var(--ease-out)}
.nav-btn:hover{translate:3px 0}
/* frosted glass header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:10px;margin-block:-10px;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-radius:0 0 18px 18px}
/* modals glide in */
.scrim{animation:fadeIn .3s ease both;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.scrim .modal{animation:popIn .5s var(--ease-out) both}
/* loader exits with a blur-zoom */
.loader{transition:opacity .6s ease,visibility .6s,transform .8s var(--ease-out),filter .8s var(--ease-out)}
.loader.out{transform:scale(1.08);filter:blur(12px)}
/* scroll-driven reveals, where the browser supports them */
@supports (animation-timeline: view()){
  #view:not(.enter) .panel .item,#view:not(.enter) .ccard,#view:not(.enter) .due-tile,#view:not(.enter) .qa,#view:not(.enter) .tot{animation:riseIn linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
}
@media (prefers-reduced-motion:reduce){.hero::before,.hero::after{animation:none!important}.top{backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); return iso(d) };
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function parse(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d) }
function daysUntil(s){ const d=parse(s); if(!d) return null; const t=parse(todayISO()); return Math.round((d-t)/86400000) }
function fmtDate(s){ const d=parse(s); return d? d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '' }
function whenLabel(s){ const n=daysUntil(s); if(n===null) return 'No date'; if(n<0) return (-n)+(n===-1?' day':' days')+' overdue'; if(n===0) return 'Due today'; if(n===1) return 'Due tomorrow'; return n+' days left' }
function whenPill(s,done){ if(done||!s) return ''; const n=daysUntil(s); const cls=n<0?'pink':n<=2?'amber':'violet'; return `<span class="pill ${cls}">${whenLabel(s)}</span>` }
const num = v => { const n=Number(String(v??'').replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0 };
const mwk = v => 'MWK '+Math.round(num(v)).toLocaleString('en-US');
function mwkShort(v){ const n=Math.round(num(v)); if(Math.abs(n)>=1e6) return 'MWK '+(n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,'')+'M'; if(Math.abs(n)>=1e4) return 'MWK '+Math.round(n/1e3)+'K'; return mwk(n) }
const initials = s => String(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');

/* derived */
const outstanding = inv => inv.status==='Paid' ? 0 : Math.max(0, num(inv.amount)-num(inv.paid));
const invOpen = inv => inv.status!=='Draft' && outstanding(inv)>0;
const taskOpen = t => t.status!=='Done';
const billOpen = b => b.status!=='Paid';
const purOpen = p => p.status!=='Bought';
const purCost = p => num(p.unitCost)*(num(p.qty)||1);
const gigBal = g => Math.max(0, num(g.fee)-num(g.paid));
const gigLive = g => g.status!=='Cancelled';
function gigPayPill(g){ if(g.status==='Cancelled') return '<span class="pill">Cancelled</span>'; const b=gigBal(g); if(!num(g.fee)) return ''; if(b===0) return '<span class="pill green">Paid in full</span>'; if(num(g.paid)>0) return '<span class="pill blue">Deposit paid</span>'; return '<span class="pill amber">Unpaid</span>' }
function invStatusPill(inv){
  if(inv.status==='Paid'||(outstanding(inv)===0&&num(inv.amount)>0)) return '<span class="pill green">Paid</span>';
  if(inv.status==='Draft') return '<span class="pill">Draft</span>';
  if(inv.due && daysUntil(inv.due)<0) return '<span class="pill pink">Overdue</span>';
  if(inv.status==='Part-paid') return '<span class="pill blue">Part-paid</span>';
  return '<span class="pill violet">Awaiting payment</span>';
}

function countUp(root){
  root.querySelectorAll('.hstat .val, .tot .val').forEach(el=>{
    const txt=el.textContent, m=txt.match(/^(\D*?)([\d][\d,]*(?:\.\d+)?)(\D*)$/); if(!m) return;
    const target=parseFloat(m[2].replace(/,/g,'')); if(!target) return;
    const dec=(m[2].split('.')[1]||'').length, comma=m[2].includes(',')||target>=1000&&!m[3].trim(), t0=performance.now(), D=900;
    const fmt=n=>{ const s=n.toFixed(dec); return comma?Number(s).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}):s };
    const step=now=>{ const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3); if(el.textContent!==txt&&k===0) return; el.textContent=m[1]+fmt(target*e)+m[3]; if(k<1) requestAnimationFrame(step); else el.textContent=txt };
    el.textContent=m[1]+fmt(0)+m[3]; requestAnimationFrame(step);
  });
}

const LOGGED={tasks:'task',clients:'client',invoices:'invoice',bills:'payment',purchases:'purchase',gigs:'gig',groceries:'grocery item',docs:'document',brands:'company details'};
function labelOf(c,d){ d=d||{}; switch(c){
  case 'tasks': return d.title; case 'clients': return d.name; case 'invoices': return [d.client,d.ref].filter(Boolean).join(' '); case 'bills': return d.payee;
  case 'purchases': return d.item; case 'gigs': return d.event; case 'groceries': return d.item; case 'docs': return [d.number,d.client].filter(Boolean).join(' · ');
  case 'brands': return (BRAND_DEFAULTS[d.__id]||{}).label; default: return '' } }
function verbFor(c,before,patch){
  if(c==='groceries'&&'got' in patch&&Object.keys(patch).every(k=>['got','gotAt','updatedAt','updatedBy'].includes(k))) return patch.got?'ticked off':'unticked';
  if((c==='invoices'||c==='bills')&&patch.status==='Paid'&&before&&before.status!=='Paid') return 'marked paid';
  if(c==='gigs'&&'paid' in patch&&before&&num(patch.paid)>=num(before.fee)&&num(before.paid)<num(before.fee)) return 'marked paid';
  if(c==='clients'&&patch.lastSweep&&before&&patch.lastSweep!==before.lastSweep&&Object.keys(patch).length<=6) return 'logged a sweep for';
  if(c==='tasks'&&patch.status==='Done'&&before&&before.status!=='Done') return 'completed';
  return 'changed';
}
async function logAct(action,col,docId,label){
  if(!S.rawDb||!S.me||!S.me.id) return;
  try{
    await S.rawDb.collection('activity').doc().set({by:S.me.id,action,col,docId:docId||'',label:String(label||'').slice(0,120),at:Date.now()});
    if(S.activity.length>400){ const old=[...S.activity].sort((a,b)=>a.at-b.at).slice(0,25); for(const o of old) await S.rawDb.collection('activity').doc(o.id).delete() }
  }catch(e){}
}
function wrapDb(db){
  return { collection:(c)=>{ const col=db.collection(c); return {
    onSnapshot:(...a)=>col.onSnapshot(...a), where:(...a)=>col.where(...a), orderBy:(...a)=>col.orderBy(...a), limit:(...a)=>col.limit(...a), get:()=>col.get(),
    doc:(id)=>{ const ref=id?col.doc(id):col.doc(); const did=ref.id; const watch=!!LOGGED[c];
      return { id:did, path:ref.path, get:()=>ref.get(), onSnapshot:(...a)=>ref.onSnapshot(...a),
        set:async(data,o={})=>{ const before=findLocal(c,did); await ref.set(data); if(watch&&!o.quiet) logAct(before?'changed':'added',c,did,labelOf(c,{...data,__id:did})) },
        update:async(data,o={})=>{ const before=findLocal(c,did); await ref.update(data); if(watch&&!o.quiet) logAct(verbFor(c,before,data),c,did,labelOf(c,{...(before||{}),...data,__id:did})) },
        delete:async(o={})=>{ const before=findLocal(c,did); await ref.delete(); if(watch&&!o.quiet&&before) logAct('deleted',c,did,labelOf(c,{...before,__id:did})) } } } } } };
}

/* ---------- modal form ---------- */
let confirmDel=false;
function openForm(col,id){
  const sch=SCHEMAS[col]; const d=id?{...findDoc(col,id)}:{};
  if(!id){ if(col==='tasks'){d.status='To do';d.priority='Normal';d.workspace=S.taskWs!=='All'?S.taskWs:'VISIO'} if(col==='clients')d.status='Active'; if(col==='invoices'){d.status='Sent';d.issued=todayISO()} if(col==='bills'){d.status='Unpaid';d.repeat='One-off'} if(col==='purchases'){d.status='Needed';d.qty=1} }
  confirmDel=false;
  const ro=!S.canWrite;
  const clientsDl=`<datalist id="clientList">${S.clients.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`;
  const field=f=>{ const v=d[f.k]??''; const idA=`f-${col}-${f.k}`; let inp;
    if(f.t==='select') inp=`<select id="${idA}" name="${f.k}" ${ro?'disabled':''}>${f.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.t==='textarea') inp=`<textarea id="${idA}" name="${f.k}" ${ro?'readonly':''}>${esc(v)}</textarea>`;
    else { const type=f.t==='money'||f.t==='number'?'text':f.t==='client'?'text':f.t; const extra=f.t==='money'||f.t==='number'?'inputmode="numeric"':f.t==='client'?'list="clientList"':''; inp=`<input id="${idA}" name="${f.k}" type="${type}" ${extra} value="${esc(f.t==='money'&&v!==''?Math.round(num(v)).toLocaleString('en-US'):v)}" ${f.req?'required':''} ${ro?'readonly':''} placeholder="${esc(f.ph||'')}">` }
    return `<div class="field ${f.full?'full':''}"><label for="${idA}">${esc(f.l)}</label>${inp}</div>` };
  $('#modalRoot').innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">${ro?'':id?'Edit ':'New '}${esc(sch.label)}</h3>
    <form class="form" id="mForm" novalidate>${sch.fields.map(field).join('')}${clientsDl}</form>
    <div id="mErr" class="banner" style="margin-top:12px" hidden></div>
    <div class="modal-actions">${ro?'':`<button class="btn primary" id="mSave">${id?'Save changes':'Add '+esc(sch.label)}</button>`}<button class="btn ghost" id="mCancel">${ro?'Close':'Cancel'}</button><span class="spacer"></span>${id&&!ro?`<button class="btn danger" id="mDel">Delete</button>`:''}</div>
  </div></div>`;
  const first=$('#mForm input,#mForm select'); first&&first.focus();
  $('#mCancel').onclick=closeForm;
  $('#scrim').addEventListener('mousedown',e=>{if(e.target.id==='scrim')closeForm()});
  if($('#mSave')) $('#mSave').onclick=()=>saveForm(col,id);
  if($('#mDel')) $('#mDel').onclick=async()=>{ if(!confirmDel){confirmDel=true;$('#mDel').textContent='Tap again to delete';return} try{await S.db.collection(col).doc(id).delete();closeForm();toast('Deleted')}catch(e){showErr(e)} };
}
function closeForm(){$('#modalRoot').innerHTML=''}
function showErr(e){const el=$('#mErr'); if(!el){toast(dbMsg(e));return} el.hidden=false; el.textContent=dbMsg(e)}
function dbMsg(e){ const c=e&&e.code; if(c==='invalid_argument')return'You can view this tracker but not change it. Ask the owner for Contributor access.'; if(c==='quota_exceeded')return'The tracker is full. Delete old records to make room.'; if(c==='unavailable')return'Connection hiccup. Try again in a moment.'; return 'Could not save. Try again.' }
async function saveForm(col,id){
  const sch=SCHEMAS[col]; const fd=new FormData($('#mForm')); const data={};
  for(const f of sch.fields){ let v=(fd.get(f.k)??'').toString().trim(); if(f.t==='money'||f.t==='number') v=v===''?'':num(v); data[f.k]=v; if(f.req&&(v===''||v===null)){ showErr({code:'x'}); $('#mErr').textContent=f.l+' is required.'; return } }
  const now=Date.now(); const uid=S.me&&S.me.id;
  if(col==='invoices'&&data.status==='Paid'){ if(!id||findDoc(col,id).status!=='Paid'){data.paidOn=todayISO()} if(data.paid===''||num(data.paid)<num(data.amount)) data.paid=num(data.amount) }
  data.updatedAt=now; if(uid) data.updatedBy=uid;
  $('#mSave').disabled=true;
  try{
    if(id){ await S.db.collection(col).doc(id).update(data) }
    else { data.createdAt=now; await S.db.collection(col).doc().set(data) }
    closeForm(); toast(id?'Saved':'Added');
  }catch(e){ $('#mSave').disabled=false; showErr(e) }
}

/* ---------- actions ---------- */
function addPeriod(s,rep){ const d=parse(s)||parse(todayISO()); const m={Monthly:1,Quarterly:3,Yearly:12}[rep]||0; const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+m); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return iso(d) }
async function markPaid(col,id){
  const d=findDoc(col,id); if(!d) return; const now=Date.now(); const base={updatedAt:now}; if(S.me&&S.me.id) base.updatedBy=S.me.id;
  try{
    if(col==='invoices'){ await S.db.collection(col).doc(id).update({...base,status:'Paid',paid:num(d.amount),paidOn:todayISO()}); toast('Marked paid') }
    else if(col==='gigs'){ await S.db.collection(col).doc(id).update({...base,paid:num(d.fee),paidOn:todayISO()}); toast('Gig marked paid in full') }
    else { if(d.repeat&&d.repeat!=='One-off'){ const next=addPeriod(d.due,d.repeat); await S.db.collection(col).doc(id).update({...base,status:'Unpaid',lastPaidOn:todayISO(),due:next,calendarAt:null}); toast('Paid. Next one due '+fmtDate(next)) } else { await S.db.collection(col).doc(id).update({...base,status:'Paid',lastPaidOn:todayISO()}); toast('Marked paid') } }
  }catch(e){toast(dbMsg(e))}
}
async function logSweep(id){
  const c=findDoc('clients',id); if(!c) return; const next=addPeriod(todayISO(),'Monthly');
  try{ await S.db.collection('clients').doc(id).update({lastSweep:todayISO(),nextSweep:next,updatedAt:Date.now(),...(S.me&&S.me.id?{updatedBy:S.me.id}:{}),calendarAt:null}); toast('Sweep logged. Next one '+fmtDate(next)) }catch(e){toast(dbMsg(e))}
}
async function addToCalendar(col,id,btn){
  const d=findDoc(col,id); if(!d||!S.mcp) return;
  const it=dueItems().find(x=>x.col===col&&x.id===id); if(!it){toast('This item has no open due date');return}
  const nextDay=iso(new Date(parse(it.date).getTime()+86400000));
  const lines=[it.kind+(it.amount?' · '+mwk(it.amount):''), it.sub, d.notes].filter(Boolean);
  let startTime=it.date+'T08:00:00', endTime=it.date+'T08:30:00';

const PAGE={w:540,h:779.76};
function canvasPen(ctx,s){
  const font=(size,bold)=>`${bold?'700':'400'} ${size*s}px Helvetica, Arial, sans-serif`;
  return {
    w:(t,size,bold)=>{ ctx.font=font(size,bold); return ctx.measureText(t).width/s },
    text:(t,x,y,o={})=>{ ctx.font=font(o.size||10.8,o.bold); ctx.fillStyle=o.color||'#000'; ctx.textBaseline='top'; ctx.textAlign=o.align||'left'; ctx.fillText(t,x*s,(y+1)*s) },
    rect:(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x*s,y*s,w*s,h*s) },
    line:(x1,y,x2,lw,c)=>{ ctx.strokeStyle=c; ctx.lineWidth=lw*s; ctx.beginPath(); ctx.moveTo(x1*s,y*s); ctx.lineTo(x2*s,y*s); ctx.stroke() },
    img:(k,x,y,w,h)=>{ const im=IMG[k]; if(im&&im.complete&&im.naturalWidth) ctx.drawImage(im,x*s,y*s,w*s,h*s) }
  };
}
function pdfPen(doc){
  const set=(size,bold,color)=>{ doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(size); doc.setTextColor(color||'#000000') };
  return {
    w:(t,size,bold)=>{ set(size,bold); return doc.getTextWidth(t) },
    text:(t,x,y,o={})=>{ set(o.size||10.8,o.bold,o.color); doc.text(String(t),x,y+1,{baseline:'top',align:o.align||'left'}) },
    rect:(x,y,w,h,c)=>{ doc.setFillColor(c); doc.rect(x,y,w,h,'F') },
    line:(x1,y,x2,lw,c)=>{ doc.setDrawColor(c); doc.setLineWidth(lw); doc.line(x1,y,x2,y) },
    img:(k,x,y,w,h)=>{ doc.addImage(ASSETS[k], k==='pattern'?'JPEG':'PNG', x,y,w,h, k, 'FAST') }
  };
}
function wrap(p,t,maxW,size,bold){
  const out=[]; String(t||'').split('\n').forEach(par=>{ let cur=''; par.split(/\s+/).filter(Boolean).forEach(w=>{ const tryT=cur?cur+' '+w:w; if(p.w(tryT,size,bold)>maxW&&cur){ out.push(cur); cur=w } else cur=tryT }); out.push(cur) });
  return out.length?out:[''];
}
/* text made of normal + bold runs: parts = [[text,bold,color?],...] */
function spans(p,parts,x,y,size,align,color){
  const total=parts.reduce((a,[t,b])=>a+p.w(t,size,b),0);
  let cx = align==='right'? x-total : align==='center'? x-total/2 : x;
  parts.forEach(([t,b,c])=>{ p.text(t,cx,y,{size,bold:b,color:c||color}); cx+=p.w(t,size,b) });
}
function drawItems(p,d,o){ // o: {y, descX, amtX, descW, lineH, gap, fmt}
  let y=o.y, lastTop=y;
  (d.items||[]).filter(i=>String(i.desc||'').trim()||num(i.amount)).forEach(i=>{
    const ls=wrap(p,i.desc,o.descW,10.8,false); lastTop=y;
    ls.forEach((l,k)=>{ p.text(l,o.descX,y+k*o.lineH); if(k<ls.length-1) lastTop=y+(k+1)*o.lineH });
    if(String(i.amount).trim()!=='') p.text(o.fmt(i.amount),o.amtX,y);
    y += ls.length*o.lineH + o.gap;
  });
  return {lastTop, next:y};
}

  const cur=b.layout==='dj'?'MWK':'MK', money=n=>cur+nf(n)+'.00', total=docTotal(d), labX=amtX-12;

function drawPreview(){
  const c=document.getElementById('genCanvas'); if(!c) return;
  const cssW=c.clientWidth||400, dpr=Math.min(2,window.devicePixelRatio||1), s=cssW*dpr/PAGE.w;
  c.width=Math.round(PAGE.w*s); c.height=Math.round(PAGE.h*s);
  const d={...S.gen, number:S.gen.editId?(findDoc('docs',S.gen.editId)||{}).number:''};
  drawDoc(canvasPen(c.getContext('2d'),s),d);
  const t=document.getElementById('gTotal'); if(t) t.textContent=mwk(docTotal(S.gen));
  const bl=document.getElementById('gBal'); if(bl) bl.textContent=mwk(Math.max(0,docTotal(S.gen)-num(S.gen.prevPaid)-num(S.gen.received)));
}
function buildPdfBlob(d){
  if(!window.jspdf){ throw {code:'nolib'} }
  const doc=new window.jspdf.jsPDF({unit:'pt',format:[PAGE.w,PAGE.h],compress:true});
  drawDoc(pdfPen(doc),d);
  doc.setProperties({title:d.number+' '+(d.client||''),author:brandOf(d.company).label});
  return doc.output('blob');
}
async function downloadDoc(d){
  const dl=await claude.use('downloads');
  if(!dl){ toast('Downloads are not available in this view. Open the page in claude.ai to save PDFs.'); return }
  let blob; try{ blob=buildPdfBlob(d) }catch(e){ toast('The PDF tool did not load. Reload the page and try again.'); return }
  const name=(d.number+' - '+(d.client||'Client')).replace(/[\\/:*?"<>|]+/g,'').slice(0,120)+'.pdf';
  try{ await dl.save({filename:name,data:blob}); toast('Saved '+name) }
  catch(e){ if(e&&e.code==='declined') return; toast(e&&e.code==='rate_limited'?'A save prompt is already open.':'Could not save the PDF.') }
}

/* ---- actions ---- */
function nextNumber(company,type){
  const seq=1+S.docs.filter(x=>x.company===company&&x.type===type).reduce((m,x)=>Math.max(m,num(x.seq)),0);
  return {seq, number:`${BRAND_DEFAULTS[company].prefix}-${DOC_TYPES[type].code}-${String(seq).padStart(4,'0')}`};
}
function genErr(m){ const e=$('#gErr'); if(e){ e.hidden=false; e.textContent=m } else toast(m) }
async function saveGen(download){
  const g=S.gen; const items=g.items.filter(i=>String(i.desc||'').trim()||num(i.amount)).map(i=>({desc:String(i.desc||'').trim(),amount:num(i.amount)}));
  if(!String(g.client).trim()) return genErr('Add the client name.');
  if(!items.length||!items.some(i=>i.amount>0)) return genErr('Add at least one line with an amount.');
  if(g.type==='receipt'&&!(num(g.received)>0)) return genErr('Add the amount received.');
  const now=Date.now(), uid=S.me&&S.me.id;
  const existing=g.editId?findDoc('docs',g.editId):null;
  const sameKind=existing&&existing.company===g.company&&existing.type===g.type;
  const {seq,number}=sameKind?{seq:existing.seq,number:existing.number}:nextNumber(g.company,g.type);
  const fromInv=g.fromInvoiceId?findDoc('docs',g.fromInvoiceId):null;
  const data={company:g.company,type:g.type,seq,number,client:String(g.client).trim(),date:g.date,due:g.type==='invoice'?g.due:'',items,total:items.reduce((a,i)=>a+i.amount,0),
    note:g.note==null?null:g.note,received:g.type==='receipt'?num(g.received):0,method:g.type==='receipt'?g.method:'',prevPaid:g.type==='receipt'?num(g.prevPaid):0,
    fromInvoiceId:g.type==='receipt'?(g.fromInvoiceId||''):'',forRef:g.type==='receipt'&&fromInv?fromInv.number:'',fromQuoteId:g.fromQuoteId||'',
    createdAt:sameKind?existing.createdAt:now,updatedAt:now,...(uid?{updatedBy:uid}:{})};
  const id=sameKind?existing.id:db_newId();
  try{
    await S.db.collection('docs').doc(id).set(data);
    if(data.type==='invoice'){
      const mid='gen-'+id, m=findDoc('invoices',mid);
      const fields={client:data.client,ref:number,description:items[0].desc.split('\n')[0].slice(0,80)+(items.length>1?' + '+(items.length-1)+' more':''),amount:data.total,issued:data.date,due:data.due,docId:id,updatedAt:now,...(uid?{updatedBy:uid}:{})};
      if(m) await S.db.collection('invoices').doc(mid).update(fields,{quiet:true});
      else await S.db.collection('invoices').doc(mid).set({...fields,paid:0,status:'Sent',notes:BRAND_DEFAULTS[data.company].label,createdAt:now},{quiet:true});
    }
    if(data.type==='receipt'&&data.fromInvoiceId&&!sameKind){
      const mid='gen-'+data.fromInvoiceId, m=findDoc('invoices',mid);
      if(m){ const paid=Math.min(num(m.amount),data.prevPaid+data.received); await S.db.collection('invoices').doc(mid).update({paid,status:paid>=num(m.amount)?'Paid':'Part-paid',paidOn:data.date,updatedAt:now},{quiet:true}) }
    }
    S.gen.editId=id; toast('Saved '+number+(data.type==='invoice'?' and added to Money':''));
    render();
    if(download) await downloadDoc({...data,id});
  }catch(e){ genErr(dbMsg(e)) }
}
function db_newId(){ return S.db.collection('docs').doc().id }
function loadDoc(x,over){
  S.gen={company:x.company,type:x.type,client:x.client,date:x.date,due:x.due||'',items:(x.items||[]).map(i=>({desc:i.desc,amount:i.amount})),note:x.note==null?null:x.note,

function genClick(b){
  const g=S.gen;
  if(b.dataset.genco){ const keepNote=false; g.company=b.dataset.genco; g.note=null; if(g.editId) g.editId=null; render(); return true }
  if(b.dataset.gentype){ g.type=b.dataset.gentype; if(g.type==='invoice'&&!g.due) g.due=addDays(g.date,14); if(g.editId) g.editId=null; render(); return true }
  if(b.dataset.gadd){ g.items.push({desc:'',amount:''}); render(); const el=$('#gd-'+(g.items.length-1)); el&&el.focus(); return true }
  if(b.dataset.grm){ g.items.splice(+b.dataset.grm,1); if(!g.items.length) g.items=[{desc:'',amount:''}]; render(); return true }
  if(b.dataset.gnew){ newDraft(); render(); return true }
  if(b.dataset.gsave){ saveGen(b.dataset.gsave==='dl'); return true }
  if(b.dataset.gpdf){ downloadDoc({...g,number:'DRAFT'}); return true }
  if(b.dataset.gdl){ const x=findDoc('docs',b.dataset.gdl); x&&downloadDoc(x); return true }

  if(b.dataset.gconv){ const x=findDoc('docs',b.dataset.gconv); if(x){ loadDoc(x,{type:'invoice',editId:null,date:todayISO(),due:addDays(todayISO(),14),fromQuoteId:x.id}); render(); window.scrollTo({top:0,behavior:'smooth'}); toast('Invoice drafted from '+x.number+'. Check it, then save.') } return true }
  if(b.dataset.grc){ const x=findDoc('docs',b.dataset.grc); if(x){ const m=findDoc('invoices','gen-'+x.id); const prev=m?num(m.paid):0; loadDoc(x,{type:'receipt',editId:null,date:todayISO(),due:'',prevPaid:prev||'',received:Math.max(0,num(x.total)-prev),method:'Bank transfer',fromInvoiceId:x.id,note:''}); render(); window.scrollTo({top:0,behavior:'smooth'}); toast('Receipt drafted for '+x.number+'. Adjust the amount if it was a part payment.') } return true }
  if(b.dataset.gdel){ const id=b.dataset.gdel; if(S.gdelArm!==id){ S.gdelArm=id; render(); setTimeout(()=>{ if(S.gdelArm===id){S.gdelArm=null;render()} },4000); return true }
    S.gdelArm=null; S.db.collection('docs').doc(id).delete().then(()=>{ if(S.gen.editId===id) S.gen.editId=null; toast('Document deleted. Any Money record for it stays until you delete it there.') }).catch(e=>toast(dbMsg(e))); return true }
  if(b.dataset.genbrand){ openBrand(b.dataset.genbrand); return true }
  return false;
}

/* ---------- RTT: real time transactions (Dad only, stored in Dad's private space) ---------- */
const RTT_CATS=['Gigs','Designs','Marketing','Social media management','Video','Others'];
const RTT_COLORS={'Gigs':'#6B4EF0','Designs':'#E2507F','Marketing':'#2F6FD6','Social media management':'#14936A','Video':'#C27A0E','Others':'#8E8AA8'};
const isDad=()=>!!(S.me&&S.me.isOwner);
const ymOf=s=>String(s||'').slice(0,7);
const ymNow=()=>todayISO().slice(0,7);
function ymLabel(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}) }
function ymShift(ym,k){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+k,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0') }
function ymLastDay(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0) }
const ymClosed=ym=>ym<ymNow();
function rttRef(){ return S.rawDb&&S.me&&S.me.id ? S.rawDb.doc('data/users/'+S.me.id+'/rtt') : null }
function rttCol(){ const r=rttRef(); return r? r.collection('entries') : null }
function rttMonth(ym){ const list=S.rtt.filter(e=>ymOf(e.date)===ym).sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0)));
  const inc=list.filter(e=>e.kind==='in'), out=list.filter(e=>e.kind==='out');
  const tin=inc.reduce((a,e)=>a+num(e.amount),0), tout=out.reduce((a,e)=>a+num(e.amount),0);
  const byCat=RTT_CATS.map(c=>[c,inc.filter(e=>(e.category||'Others')===c).reduce((a,e)=>a+num(e.amount),0)]);
  return {inc,out,tin,tout,net:tin-tout,byCat} }

function vRTT(){
  if(!isDad()) return `<div class="empty"><b>Nothing here</b></div>`;
  const ym=S.rttMonth||ymNow(), M=rttMonth(ym), closed=ymClosed(ym), editable=!closed||S.rttUnlock===ym;
  const last=ymLastDay(ym), daysLeft=Math.round((last-parse(todayISO()))/864e5);
  const status=closed?`<span class="pill">Closed ${last.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>`:`<span class="pill green">Open · closes ${last.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}${daysLeft>=0?` (${daysLeft===0?'today':daysLeft+' day'+(daysLeft>1?'s':'')+' left'})`:''}</span>`;
  const bar=M.tin?`<div class="rtt-bar">${M.byCat.filter(x=>x[1]>0).map(([c,v])=>`<span style="flex:${v};background:${RTT_COLORS[c]}" title="${esc(c)}: ${mwk(v)}"></span>`).join('')}</div>
    <div class="rtt-legend">${M.byCat.filter(x=>x[1]>0).map(([c,v])=>`<span><i style="background:${RTT_COLORS[c]}"></i>${esc(c)} <b class="num">${mwk(v)}</b> <em>${Math.round(v/M.tin*100)}%</em></span>`).join('')}</div>`:'';
  const row=e=>`<div class="item"><div class="rtt-date"><b>${parse(e.date)?parse(e.date).getDate():'–'}</b><span>${parse(e.date)?parse(e.date).toLocaleDateString('en-GB',{month:'short'}):''}</span></div>
    <div class="body"><div class="t">${esc(e.kind==='in'?(e.purpose||e.source||'Income'):(e.item||'Expense'))}</div>
      <div class="s">${e.kind==='in'?`<span>From ${esc(e.source||'—')}</span><span class="pill" style="background:${RTT_COLORS[e.category||'Others']}1f;color:${RTT_COLORS[e.category||'Others']}">${esc(e.category||'Others')}</span>`:''}</div></div>
    <div class="actions"><b class="num" style="color:${e.kind==='in'?'var(--green)':'var(--pink)'};white-space:nowrap">${e.kind==='in'?'+':'−'} ${mwk(e.amount)}</b>${editable?`<button class="icon-btn" data-rttedit="${e.id}" aria-label="Edit" title="Edit">${ico('i-edit')}</button>`:''}</div></div>`;
  const today=ym===ymNow()?todayISO():ym+'-01';
  return `<div class="rtt-head"><div class="rtt-month"><button class="icon-btn" data-rttm="-1" aria-label="Previous month">‹</button><h3>${ymLabel(ym)}</h3><button class="icon-btn" data-rttm="1" aria-label="Next month" ${ym>=ymNow()?'disabled':''}>›</button></div>${status}<span class="spacer"></span>
    ${closed&&S.rttUnlock!==ym?`<button class="btn small" data-rttunlock="${ym}">Make a correction</button>`:''}<button class="btn small primary" data-rttpdf="${ym}">${ico('i-in')}Download report</button></div>
  <div class="totals" style="margin-top:14px">
    <div class="tot good"><div class="lbl">Money in</div><div class="val num">${mwk(M.tin)}</div><div class="s" style="font-size:12px;color:var(--ink-3)">${M.inc.length} transaction${M.inc.length===1?'':'s'}</div></div>
    <div class="tot alert"><div class="lbl">Money out</div><div class="val num">${mwk(M.tout)}</div><div class="s" style="font-size:12px;color:var(--ink-3)">${M.out.length} transaction${M.out.length===1?'':'s'}</div></div>
    <div class="tot ${M.net<0?'alert':'good'}"><div class="lbl">Balance for the month</div><div class="val num">${M.net<0?'−':''}${mwk(Math.abs(M.net))}</div><div class="s" style="font-size:12px;color:var(--ink-3)">${M.tin?Math.round(M.tout/M.tin*100)+'% of income spent':'No income yet'}</div></div>
  </div>
  ${bar?`<section class="panel" style="margin-top:14px"><div class="section-head"><h3>Income by category</h3></div>${bar}</section>`:''}
  <div class="rtt-cols">
    <section class="panel"><div class="section-head"><h3>Money in</h3><b class="num" style="color:var(--green)">${mwk(M.tin)}</b></div>
      ${editable?`<form class="rtt-form" id="rttInForm" autocomplete="off">
        <input id="ri-date" type="date" value="${today}" aria-label="Date" required>
        <input id="ri-amt" inputmode="numeric" placeholder="Amount (MWK)" aria-label="Amount" required>
        <input id="ri-src" placeholder="From (who paid)" aria-label="Where the money came from" class="wide">
        <input id="ri-for" placeholder="What it's for" aria-label="What it is for" class="wide">
        <select id="ri-cat" aria-label="Category">${RTT_CATS.map(c=>`<option ${c===(S.rttLastCat||'Gigs')?'selected':''}>${c}</option>`).join('')}</select>
        <button class="btn primary" type="submit">${ico('i-plus')}Add income</button></form>`:''}
      ${M.inc.length?M.inc.map(row).join(''):`<div class="empty" style="margin-top:10px"><b>No income recorded</b>${editable?'Add money as it comes in.':'Nothing was recorded this month.'}</div>`}
    </section>
    <section class="panel"><div class="section-head"><h3>Money out</h3><b class="num" style="color:var(--pink)">${mwk(M.tout)}</b></div>
      ${editable?`<form class="rtt-form" id="rttOutForm" autocomplete="off">
        <input id="ro-date" type="date" value="${today}" aria-label="Date" required>
        <input id="ro-amt" inputmode="numeric" placeholder="Amount (MWK)" aria-label="Amount" required>
        <input id="ro-item" placeholder="What the money was spent on" aria-label="What the money was spent on" class="wide">
        <button class="btn primary" type="submit">${ico('i-plus')}Add expense</button></form>`:''}
      ${M.out.length?M.out.map(row).join(''):`<div class="empty" style="margin-top:10px"><b>No expenses recorded</b>${editable?'Add spending as it happens.':'Nothing was recorded this month.'}</div>`}
    </section>
  </div>
  <p style="color:var(--ink-3);font-size:12px;margin-top:14px">Only you can see RTT. Entries are saved in your private space in RA1000, which Mum's account cannot read.</p>`;
}

document.addEventListener('submit',async e=>{
  const f=e.target; if(f.id!=='rttInForm'&&f.id!=='rttOutForm') return; e.preventDefault();
  const col=rttCol(); if(!col){ toast('Sign in to record transactions.'); return }
  const isIn=f.id==='rttInForm', p=isIn?'ri':'ro', amt=num($('#'+p+'-amt').value), date=$('#'+p+'-date').value;
  if(!(amt>0)){ $('#'+p+'-amt').focus(); toast('Enter the amount.'); return }
  if(!date){ toast('Pick the date.'); return }
  const data=isIn?{kind:'in',date,amount:amt,source:$('#ri-src').value.trim(),purpose:$('#ri-for').value.trim(),category:$('#ri-cat').value,createdAt:Date.now()}
                 :{kind:'out',date,amount:amt,item:$('#ro-item').value.trim(),createdAt:Date.now()};
  if(isIn){ if(!data.source&&!data.purpose){ $('#ri-src').focus(); toast('Add who paid or what it was for.'); return } S.rttLastCat=data.category }
  else if(!data.item){ $('#ro-item').focus(); toast('Add what the money was spent on.'); return }
  f.querySelectorAll('input:not([type=date]),textarea').forEach(i=>i.value=''); (isIn?$('#ri-amt'):$('#ro-amt'))?.focus();
  try{ await col.doc().set(data); toast((isIn?'Income':'Expense')+' of '+mwk(amt)+' recorded'); if(ymOf(date)!==(S.rttMonth||ymNow())) toast('Recorded in '+ymLabel(ymOf(date))) }
  catch(err){ toast(dbMsg(err)) }
});
document.addEventListener('change',e=>{ if(['ri-amt','ro-amt'].includes(e.target.id)&&e.target.value) e.target.value=nf(e.target.value) });

function openRttEdit(id){
  const e0=S.rtt.find(x=>x.id===id); if(!e0) return; const isIn=e0.kind==='in'; let arm=false;
  $('#modalRoot').innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="reTitle"><h3 id="reTitle">Edit ${isIn?'income':'expense'}</h3>
    <div class="form">
      <div class="field"><label for="re-date">Date</label><input id="re-date" type="date" value="${esc(e0.date)}"></div>
      <div class="field"><label for="re-amt">Amount (MWK)</label><input id="re-amt" inputmode="numeric" value="${nf(e0.amount)}"></div>
      ${isIn?`<div class="field full"><label for="re-src">From</label><input id="re-src" value="${esc(e0.source||'')}"></div>
      <div class="field full"><label for="re-for">What it's for</label><input id="re-for" value="${esc(e0.purpose||'')}"></div>
      <div class="field full"><label for="re-cat">Category</label><select id="re-cat">${RTT_CATS.map(c=>`<option ${c===e0.category?'selected':''}>${c}</option>`).join('')}</select></div>`
      :`<div class="field full"><label for="re-item">Spent on</label><input id="re-item" value="${esc(e0.item||'')}"></div>`}
    </div>
    <div class="modal-actions"><button class="btn primary" id="reSave">Save changes</button><button class="btn ghost" id="mCancel">Cancel</button><span class="spacer"></span><button class="btn danger" id="reDel">Delete</button></div></div></div>`;
  $('#mCancel').onclick=closeForm; $('#scrim').addEventListener('mousedown',ev=>{if(ev.target.id==='scrim')closeForm()});
  $('#reSave').onclick=async()=>{ const d={date:$('#re-date').value,amount:num($('#re-amt').value),updatedAt:Date.now()};
    if(isIn){ d.source=$('#re-src').value.trim(); d.purpose=$('#re-for').value.trim(); d.category=$('#re-cat').value } else d.item=$('#re-item').value.trim();
    if(!(d.amount>0)||!d.date){ toast('Add a date and an amount.'); return }
    try{ await rttCol().doc(id).update(d); closeForm(); toast('Saved') }catch(err){ toast(dbMsg(err)) } };
  $('#reDel').onclick=async()=>{ if(!arm){ arm=true; $('#reDel').textContent='Tap again to delete'; return } try{ await rttCol().doc(id).delete(); closeForm(); toast('Deleted') }catch(err){ toast(dbMsg(err)) } };
}

/* month-end report: pops up once per closed month */
function maybeRttReport(){
  if(!isDad()||!S.rttLoaded||S.rttPrompted) return;
  const ym=ymShift(ymNow(),-1); const M=rttMonth(ym);
  if(!(M.inc.length||M.out.length)) return;
  if(S.rttMeta&&S.rttMeta.reports&&S.rttMeta.reports[ym]) return;
  S.rttPrompted=true;
  const show=()=>{ if($('#scrim')){ setTimeout(show,1500); return }
    $('#modalRoot').innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="rrTitle"><div class="note-eyebrow" style="color:var(--violet)">RTT · month closed</div><h3 id="rrTitle" style="margin-top:6px">${ymLabel(ym)} report is ready</h3>
      <div class="totals" style="margin:6px 0 4px"><div class="tot good"><div class="lbl">Money in</div><div class="val num">${mwk(M.tin)}</div></div><div class="tot alert"><div class="lbl">Money out</div><div class="val num">${mwk(M.tout)}</div></div><div class="tot ${M.net<0?'alert':'good'}"><div class="lbl">Balance</div><div class="val num">${M.net<0?'−':''}${mwk(Math.abs(M.net))}</div></div></div>
      <div class="modal-actions"><button class="btn primary" id="rrDl">${ico('i-in')}Download report</button><button class="btn ghost" id="mCancel">Later</button></div>
      <p style="color:var(--ink-3);font-size:12px;margin:10px 0 0">You can download it again any time from RTT.</p></div></div>`;
    const mark=()=>{ const r=rttRef(); if(r){ const reports={...((S.rttMeta&&S.rttMeta.reports)||{}),[ym]:Date.now()}; r.set({...(S.rttMeta||{}),reports}).catch(()=>{}) } };
    $('#mCancel').onclick=()=>{ mark(); closeForm() };
    $('#rrDl').onclick=async()=>{ mark(); closeForm(); await downloadRttReport(ym) };
  };
  setTimeout(show,1600);
}

/* the PDF */
let logoPng=null;
async function getLogoPng(){
  if(logoPng) return logoPng;
  const bg=getComputedStyle(document.querySelector('.brand-logo')||document.body).backgroundImage; const m=bg&&bg.match(/url\("?(.*?)"?\)$/); if(!m) return null;
  return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); logoPng={url:c.toDataURL('image/png'),w:im.naturalWidth,h:im.naturalHeight}; res(logoPng) }; im.onerror=()=>res(null); im.src=m[1] });
}
async function buildRttPdf(ym){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4',compress:true}); const W=595.28,H=841.89,L=44,R=W-44;
  const M=rttMonth(ym), V='#5B3FD9', ink='#1C1A2E', mute='#8E8AA8';
  const money=n=>'MWK '+Math.round(num(n)).toLocaleString('en-US');
  const set=(sz,b,c)=>{ doc.setFont('helvetica',b?'bold':'normal'); doc.setFontSize(sz); doc.setTextColor(c||ink) };
  let page=1;
  const footer=()=>{ set(8,false,mute); doc.text('RA1000 · RTT report · '+ymLabel(ym),L,H-24); doc.text('Page '+page,R,H-24,{align:'right'}) };
  const header=async()=>{
    doc.setFillColor('#2A0F6E'); doc.rect(0,0,W,108,'F'); doc.setFillColor('#4A2FC4'); doc.rect(0,96,W,12,'F');
    const lg=await getLogoPng(); if(lg){ const h=34, w=h*lg.w/lg.h; doc.addImage(lg.url,'PNG',L,26,w,h) }
    set(19,true,'#FFFFFF'); doc.text('Real Time Transactions',R,46,{align:'right'});
    set(11,false,'#D9CFFF'); doc.text(ymLabel(ym)+' · Monthly report',R,64,{align:'right'});
    set(8,false,'#B8A9F5'); doc.text('Generated '+new Date().toLocaleString('en-GB',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}),R,80,{align:'right'});
  };
  await header();
  let y=136;
  const box=(x,w,label,val,color)=>{ doc.setFillColor('#F4F1FD'); doc.roundedRect(x,y,w,62,8,8,'F'); doc.setFillColor(color); doc.rect(x,y+10,3,42,'F'); set(9,false,mute); doc.text(label,x+14,y+22); set(16,true,color); doc.text(val,x+14,y+46) };
  const bw=(R-L-24)/3;
  box(L,bw,'Money in',money(M.tin),'#14936A'); box(L+bw+12,bw,'Money out',money(M.tout),'#D23F70'); box(L+2*(bw+12),bw,'Balance for the month',(M.net<0?'-':'')+money(Math.abs(M.net)),M.net<0?'#D23F70':V);
  y+=86;
  const need=h=>{ if(y+h>H-50){ footer(); doc.addPage(); page++; y=50 } };
  const title=t=>{ need(40); set(12,true,ink); doc.text(t,L,y); y+=8; doc.setDrawColor(V); doc.setLineWidth(1.2); doc.line(L,y,R,y); y+=16 };
  // categories
  if(M.tin){ title('Income by category');
    M.byCat.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{ need(20); set(10,false,ink); doc.text(c,L,y); const bx=L+170, bwid=R-bx-110, frac=v/M.tin;
      doc.setFillColor('#ECE7FF'); doc.roundedRect(bx,y-8,bwid,9,4,4,'F'); doc.setFillColor(RTT_COLORS[c]); doc.roundedRect(bx,y-8,Math.max(4,bwid*frac),9,4,4,'F');
      set(10,true,ink); doc.text(money(v),R,y,{align:'right'}); set(8,false,mute); doc.text(Math.round(frac*100)+'%',bx+bwid+8,y); y+=20 }); y+=8 }
  const table=(cols,rows,totalLabel,total,color)=>{
    need(30); doc.setFillColor('#F4F1FD'); doc.rect(L,y-12,R-L,20,'F'); set(8.5,true,mute); cols.forEach(c=>doc.text(c.h,c.align==='right'?c.x2:c.x,y+1,{align:c.align||'left'})); y+=20;
    rows.forEach((r,i)=>{ const lines=cols.map(c=>doc.splitTextToSize(String(r[c.k]??''),c.w)); const h=Math.max(...lines.map(l=>l.length))*12+8; need(h);
      if(i%2) { doc.setFillColor('#FBFAFF'); doc.rect(L,y-11,R-L,h,'F') }
      cols.forEach((c,j)=>{ set(9.5,c.bold,c.color||ink); doc.text(lines[j],c.align==='right'?c.x2:c.x,y,{align:c.align||'left'}) }); y+=h });
    need(26); doc.setDrawColor('#D8D2F0'); doc.setLineWidth(.6); doc.line(L,y-6,R,y-6); set(10,true,ink); doc.text(totalLabel,L,y+8); set(11,true,color); doc.text(money(total),R,y+8,{align:'right'}); y+=34 };
  const dd=s=>{ const d=parse(s); return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'' };
  title('Money in ('+M.inc.length+')');
  if(M.inc.length) table([{h:'DATE',k:'d',x:L+6,w:50},{h:'FROM',k:'s',x:L+62,w:120},{h:'FOR',k:'p',x:L+190,w:150},{h:'CATEGORY',k:'c',x:L+348,w:90},{h:'AMOUNT',k:'a',x2:R-6,align:'right',w:80,bold:true,color:'#14936A'}],
    [...M.inc].reverse().map(e=>({d:dd(e.date),s:e.source||'-',p:e.purpose||'-',c:e.category||'Others',a:money(e.amount)})),'Total money in',M.tin,'#14936A');
  else { set(10,false,mute); doc.text('No income recorded this month.',L,y); y+=26 }
  title('Money out ('+M.out.length+')');
  if(M.out.length) table([{h:'DATE',k:'d',x:L+6,w:50},{h:'SPENT ON',k:'i',x:L+62,w:330},{h:'AMOUNT',k:'a',x2:R-6,align:'right',w:80,bold:true,color:'#D23F70'}],
    [...M.out].reverse().map(e=>({d:dd(e.date),i:e.item||'-',a:money(e.amount)})),'Total money out',M.tout,'#D23F70');
  else { set(10,false,mute); doc.text('No expenses recorded this month.',L,y); y+=26 }
  need(60); doc.setFillColor(M.net<0?'#FDE6EE':'#ECE7FF'); doc.roundedRect(L,y,R-L,48,8,8,'F'); set(11,true,ink); doc.text('Balance for '+ymLabel(ym),L+16,y+29);
  set(15,true,M.net<0?'#D23F70':V); doc.text((M.net<0?'-':'')+money(Math.abs(M.net)),R-16,y+30,{align:'right'});
  footer();
  doc.setProperties({title:'RTT report '+ymLabel(ym),author:'RA1000'});
  return doc.output('blob');
}
async function downloadRttReport(ym){
  const dl=await claude.use('downloads'); if(!dl){ toast('Downloads are not available in this view.'); return }
  let blob; try{ blob=await buildRttPdf(ym) }catch(e){ toast('Could not build the report. Reload and try again.'); return }
  const name='RTT Report - '+ymLabel(ym)+'.pdf';
  try{ await dl.save({filename:name,data:blob}); toast('Saved '+name) }catch(e){ if(e&&e.code!=='declined') toast('Could not save the report.') }
}
function rttClick(b){
  if(b.dataset.rttm){ S.rttMonth=ymShift(S.rttMonth||ymNow(),+b.dataset.rttm); if(S.rttMonth>ymNow()) S.rttMonth=ymNow(); S.rttUnlock=null; render(); return true }
  if(b.dataset.rttunlock){ S.rttUnlock=b.dataset.rttunlock; render(); toast('Editing '+ymLabel(b.dataset.rttunlock)+' for corrections'); return true }
  if(b.dataset.rttpdf){ downloadRttReport(b.dataset.rttpdf); return true }
  if(b.dataset.rttedit){ openRttEdit(b.dataset.rttedit); return true }
  return false;
}
function startRtt(){
  if(!isDad()||S.rttStarted) return; const col=rttCol(), ref=rttRef(); if(!col) return; S.rttStarted=true;
  document.querySelectorAll('[data-view="rtt"]').forEach(el=>el.hidden=false);
  ref.onSnapshot(s=>{ S.rttMeta=s.exists?s.data():{}; S.rttMetaLoaded=true; if(S.rttLoaded) maybeRttReport() },()=>{});
  col.onSnapshot(snap=>{ S.rtt=snap.docs.map(d=>({id:d.id,...d.data()})); S.rttLoaded=true; if(S.view==='rtt') render(); if(S.rttMetaLoaded) maybeRttReport() },()=>{});
}

/* ---------- boot ---------- */
$('#todayLabel').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
render();
(async()=>{
  const cl=window.claude; if(!cl||!cl.use){ hideLoader(); banner('Open this page in Claude to load the shared data.'); return }
  const [db,user,mcp]=await Promise.all([cl.use('db'),cl.use('user'),cl.use('mcp')]);
  S.rawDb=db; S.db=db?wrapDb(db):null; S.user=user; S.mcp=mcp;
  if(user){ try{ S.me=await user.me(); const w=await user.can('data.write'); if(w===false) S.canWrite=false; }catch(e){}
  }
  if(!db){ hideLoader(); banner('Sign in to claude.ai to see and update the shared tracker.'); S.loaded=true; render(); return }
  const cols=['tasks','clients','invoices','bills','purchases','gigs','groceries','docs','brands','people','notes','avatars']; const seen=new Set();
  if(S.me&&S.me.id){ try{ const st=await db.doc('data/users/'+S.me.id+'/state').get(); if(st.exists) S.lastSeen=num(st.data().lastSeen) }catch(e){} }
  startRtt();
  let firstAct=true; db.collection('activity').onSnapshot(snap=>{ onActivity(snap,firstAct); firstAct=false; if(S.view==='overview') hydrateActivity() },()=>{});
  cols.forEach(c=>db.collection(c).onSnapshot(snap=>{ if(c==='brands'||c==='people'||c==='avatars'){ S[c]={}; snap.docs.forEach(d=>S[c][d.id]=d.data()) } else S[c]=snap.docs.map(d=>({id:d.id,...d.data()})); seen.add(c); if(seen.size===cols.length&&!S.loaded){ S.loaded=true; maybeGreet(); hideLoader() } render() }, err=>{ if(err.code==='revoked'){banner('Your access to this tracker changed. Reload to continue.')} else banner('Live updates paused. Reload the page to reconnect.') }));
})();
function banner(m){const b=$('#banner'); b.hidden=false; b.textContent=m}
})();
</script>
